<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vila Letys">
<meta name="theme-color" content="#161b2b">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Vila Letys">
<meta property="og:description" content="Um joguinho feito só pra você 💙">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Vila Letys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff7e6;--brown:#6b4630;--blue:#4f9be8;--blue-d:#23508f;--pink:#ff8fb3;--ink:#3b2f2f;
  --px:'Pixelify Sans','Nunito',ui-rounded,system-ui,sans-serif;--tx:'Nunito',ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#161b2b;overflow:hidden;overscroll-behavior:none;font-family:var(--tx);
  color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#161b2b}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.hide{display:none!important}
.pill{background:var(--cream);border:2px solid var(--brown);border-radius:999px;padding:4px 11px;font:700 15px var(--px);
  box-shadow:0 2px 0 rgba(0,0,0,.22)}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(100px + env(safe-area-inset-right));zoom:var(--kc,1);display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
#goal{font:800 12.5px var(--tx);border-radius:12px;max-width:100%}
#mute,#fs{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:38px;height:38px;border-radius:50%;border:2px solid var(--brown);
  background:var(--cream);font-size:17px;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.22);zoom:var(--kc,1);color:var(--brown)}
#fs{right:calc(56px + env(safe-area-inset-right));font:700 19px/1 sans-serif}
#mgbar{zoom:var(--kc,1);position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;align-items:center;gap:6px;pointer-events:none}
#mgbar .pill{font-size:13px;padding:5px 9px}
#mgtitle{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mgscore{margin-left:auto;white-space:nowrap}
#mgexit{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--brown);background:var(--cream);
  font:700 15px var(--px);color:var(--brown);padding:0;flex:none}
#mgmsg{position:absolute;left:0;right:0;top:22%;text-align:center;font:700 24px var(--px);color:#fff;pointer-events:none;
  text-shadow:0 2px 0 #23508f,0 0 8px rgba(0,0,0,.35);padding:0 16px}
#mgmsg.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#toast{position:absolute;left:14px;right:14px;top:calc(92px + env(safe-area-inset-top));text-align:center;pointer-events:none}
#toast span{display:inline-block;background:var(--blue);color:#fff;border:2px solid var(--blue-d);border-radius:14px;
  padding:8px 14px;font:700 15px var(--px);box-shadow:0 3px 0 var(--blue-d);animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
#dpad{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:calc(156px*var(--kc,1));height:calc(156px*var(--kc,1));display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  gap:4px;touch-action:none;padding:0}
#dpad i{display:flex;align-items:center;justify-content:center;border-radius:13px;background:rgba(255,247,230,.86);
  border:2px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.22);color:var(--brown);font:normal 19px/1 sans-serif;pointer-events:none}
#dpad svg{width:52%;height:52%;fill:currentColor;display:block}
#dpad i.dg{background:rgba(255,247,230,.6);border-color:rgba(107,70,48,.6);box-shadow:none;margin:4px;border-radius:11px}
#dpad i.dg svg{width:50%;height:50%}
#dpad i.mid{background:rgba(107,70,48,.28);border:0;box-shadow:none;border-radius:50%;margin:11px}
#dpad i.on{background:var(--blue);border-color:var(--blue-d);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
#act{zoom:var(--kc,1);position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));min-width:92px;height:56px;padding:0 18px;border-radius:28px;
  background:var(--blue);color:#fff;border:3px solid var(--blue-d);font:700 18px var(--px);box-shadow:0 4px 0 var(--blue-d);
  animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
#dlg{zoom:var(--k,1);position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:104px;background:var(--cream);border:3px solid var(--brown);
  border-radius:16px;padding:20px 16px 22px;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 2px #fff}
#dname{position:absolute;top:-15px;left:14px;background:var(--blue);color:#fff;border:2px solid var(--blue-d);
  border-radius:10px;padding:1px 10px;font:700 15px var(--px)}
#dtext{font:800 16px/1.4 var(--tx);min-height:44px;text-wrap:pretty}
#dnext{position:absolute;right:14px;bottom:6px;color:var(--blue);font-size:13px;animation:bob .5s ease-in-out infinite alternate}
.screen{zoom:var(--k,1);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:22px;text-align:center;background:rgba(22,27,43,.6)}
.panel{background:var(--cream);border:3px solid var(--brown);border-radius:18px;padding:18px 18px;width:100%;max-width:340px;
  box-shadow:0 5px 0 rgba(0,0,0,.25),inset 0 0 0 2px #fff}
.btn{font:700 19px var(--px);background:var(--blue);color:#fff;border:3px solid var(--blue-d);border-radius:16px;
  padding:12px 26px;box-shadow:0 4px 0 var(--blue-d);min-width:170px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:#fff;font-size:15px;padding:6px 12px;
  text-decoration:underline;min-width:0}
#title{background:linear-gradient(180deg,rgba(30,52,110,.86),rgba(22,27,43,.62) 55%,rgba(22,27,43,.8))}
.logo{font:700 60px/0.95 var(--px);color:#fff;text-shadow:0 4px 0 var(--blue),0 8px 0 var(--blue-d),0 12px 18px rgba(0,0,0,.4);
  letter-spacing:1px}
.logo small{display:block;font-size:22px;letter-spacing:6px;margin-bottom:6px;text-shadow:0 2px 0 var(--blue-d)}
.sub{color:#fff;font:800 15px var(--tx);text-shadow:0 1px 3px rgba(0,0,0,.5);max-width:270px;text-wrap:balance}
.floaty{font-size:30px;animation:bob 1.2s ease-in-out infinite alternate}
#card .icon{font-size:46px;line-height:1}
#card h2,#lose h2{font:700 25px var(--px);margin:6px 0 8px;color:var(--blue-d)}
#card .quote{font:600 15px/1.4 var(--tx);font-style:italic;margin:0 0 10px;text-wrap:pretty}
#card .how{font:800 14px/1.4 var(--tx);background:#e6f1ff;border-radius:10px;padding:8px 10px;margin:0;text-wrap:pretty}
.victory{font:700 48px var(--px);color:#ffe07a;text-shadow:0 3px 0 #c9861f,0 6px 0 #7a4a12,0 10px 16px rgba(0,0,0,.45);
  animation:zoom .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes zoom{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.mvp{font:700 16px var(--px);color:#fff;letter-spacing:2px;margin-top:-8px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#win .bigheart{font-size:40px;animation:beat .8s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.18)}}
#winphrase{font:700 26px/1.15 var(--px);color:var(--blue-d);margin:6px 0 4px;text-wrap:balance}
#winsub{font:800 15px var(--tx);text-wrap:balance}
.sig{font:600 14px var(--tx);font-style:italic;margin-top:8px;opacity:.75}
#memory{background:rgba(60,36,28,.35);justify-content:center;padding-top:60px}
#memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:340px}
.tip{color:#fff;font:800 12.5px var(--tx);opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.mc{aspect-ratio:3/4;perspective:500px;border:0;background:none;padding:0}
.mc div{position:relative;width:100%;height:100%;transition:transform .32s;transform-style:preserve-3d}
.mc.up div,.mc.ok div{transform:rotateY(180deg)}
.mc span{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;border:3px solid var(--blue-d);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mc .bk{background:repeating-linear-gradient(45deg,#4f9be8 0 8px,#62a9f0 8px 16px);color:#fff;font-size:26px}
.mc .ft{background:var(--cream);transform:rotateY(180deg);font-size:34px;border-color:var(--brown)}
.mc.ok .ft{background:#dff3ff;border-color:var(--blue)}
#ending{justify-content:center;padding:16px 16px 18px;background:linear-gradient(180deg,rgba(60,30,80,.35),rgba(22,27,43,.6))}
#letter{max-height:70%;overflow:auto;text-align:left;font:600 15.5px/1.5 var(--tx);white-space:pre-wrap;touch-action:pan-y;
  max-width:360px}
#letter b{display:block;text-align:right;font:700 18px var(--px);color:var(--blue-d);margin-top:8px}
#since{color:#fff;font:700 17px var(--px);text-shadow:0 2px 0 rgba(0,0,0,.4);text-wrap:balance}
#since em{font-style:normal;color:#ffe07a}
.endrow{display:flex;flex-direction:column;align-items:center;gap:12px}
#since .sep{display:none}
/* celular deitado */
@media (orientation:landscape) and (max-height:540px){
  .screen{gap:8px;padding:10px 18px}
  .logo{font-size:46px}.logo small{font-size:17px;margin-bottom:2px}.floaty{font-size:22px}
  .panel{padding:10px 16px;max-width:460px}
  .btn{padding:9px 24px;font-size:17px}
  #card .icon{font-size:30px}#card h2,#lose h2{font-size:21px;margin:2px 0 4px}
  #card .quote{margin-bottom:6px;font-size:14px}#card .how{font-size:13px;padding:6px 10px}
  #card,#lose{flex-direction:row;flex-wrap:wrap;align-content:center}
  #card .panel,#lose .panel{flex:0 0 100%;margin:0 auto}
  .victory{font-size:34px}.mvp{font-size:13px;margin-top:-4px}
  #win .bigheart{font-size:26px}#winphrase{font-size:21px;margin:2px 0}#winsub{font-size:14px}.sig{margin-top:3px}
  #memory{padding-top:52px}
  #memgrid{grid-template-columns:repeat(8,1fr);max-width:min(94vw,620px);gap:8px}
  .mc .ft{font-size:28px}.mc .bk{font-size:20px}
  #ending{gap:8px;padding:10px 16px}
  .endrow{flex-direction:row;gap:14px}
  #letter{max-width:600px;max-height:68%;font-size:14.5px}
  #since{font-size:14px;text-align:right}#since br{display:none}#since .sep{display:inline}
  #dpad{width:calc(148px*var(--kc,1));height:calc(148px*var(--kc,1));bottom:calc(12px + env(safe-area-inset-bottom))}
  #act{bottom:calc(20px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right))}
  #dlg{min-height:84px;padding:16px 14px 18px}
  #goal{font-size:12px}
  #mgmsg{top:15%;font-size:20px}
}
#app .screen{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#iostip{max-width:300px;text-wrap:balance}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hide">
    <div class="pill" id="hearts">💙 <span id="hn">0</span>/6</div>
    <div class="pill" id="goal"></div>
  </div>
  <button id="mute" class="hide" aria-label="Som">🔊</button>
  <button id="fs" class="hide" aria-label="Tela cheia">⛶</button>

  <div id="mgbar" class="hide">
    <span class="pill" id="mgtitle"></span>
    <span class="pill" id="mgscore"></span>
    <button id="mgexit" aria-label="Sair">✕</button>
  </div>
  <div id="mgmsg"></div>
  <div id="toast" class="hide"><span></span></div>

  <div id="dpad" class="hide" aria-label="Direcional"><i class="dg" data-d="5"><svg viewBox="0 0 24 24" style="transform:rotate(-45deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i data-d="6"><svg viewBox="0 0 24 24" style="transform:rotate(0deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i class="dg" data-d="7"><svg viewBox="0 0 24 24" style="transform:rotate(45deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i data-d="4"><svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i class="mid"></i><i data-d="0"><svg viewBox="0 0 24 24" style="transform:rotate(90deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i class="dg" data-d="3"><svg viewBox="0 0 24 24" style="transform:rotate(-135deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i data-d="2"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i><i class="dg" data-d="1"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M12 3 21 13.5h-5.4V21H8.4v-7.5H3z"/></svg></i></div>
  <button id="act" class="hide"></button>

  <div id="dlg" class="hide">
    <div id="dname"></div>
    <div id="dtext"></div>
    <div id="dnext">▼</div>
  </div>

  <section id="title" class="screen">
    <div class="floaty">💙</div>
    <div class="logo"><small>VILA</small>Letys</div>
    <div class="sub">um joguinho feito pelo Teasy, só pra você</div>
    <button class="btn" id="play">Jogar</button>
    <button class="btn ghost hide" id="reset">Recomeçar do zero</button>
    <button class="btn ghost hide" id="fs2">⛶ Tela cheia</button>
    <div class="tip">📱 Dá pra jogar com o celular em pé ou deitado</div>
    <div class="tip hide" id="iostip">No iPhone: toque em Compartilhar e depois em “Adicionar à Tela de Início” pra jogar em tela cheia</div>
  </section>

  <section id="card" class="screen hide">
    <div class="panel">
      <div class="icon" id="cicon"></div>
      <h2 id="ctitle"></h2>
      <p class="quote" id="cquote"></p>
      <p class="how" id="chow"></p>
    </div>
    <button class="btn" id="cgo">Começar</button>
    <button class="btn ghost" id="cno">Agora não</button>
  </section>

  <section id="win" class="screen hide">
    <div class="victory">VITÓRIA!</div>
    <div class="mvp">★ MVP · LETYS ★</div>
    <div class="panel">
      <div class="bigheart">💙</div>
      <div id="winphrase"></div>
      <div id="winsub"></div>
      <div class="sig">— Teasy</div>
    </div>
    <button class="btn" id="winok">Continuar</button>
  </section>

  <section id="lose" class="screen hide">
    <div class="panel">
      <div style="font-size:42px">🥺</div>
      <h2>Quase!</h2>
      <div style="font:800 15px var(--tx)">Foi por pouquinho, mozi. Tenta de novo?</div>
    </div>
    <button class="btn" id="retry">Tentar de novo</button>
    <button class="btn ghost" id="giveup">Voltar pra vila</button>
  </section>

  <section id="memory" class="screen hide"><div id="memgrid"></div></section>

  <section id="ending" class="screen hide">
    <div class="panel" id="letter"></div>
    <div class="endrow">
      <div id="since" class="hide"></div>
      <button class="btn hide" id="endok">Voltar pra vila 💙</button>
    </div>
  </section>
</div>

<script>
'use strict';
/* ================= util ================= */
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hide',!on);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const cv=$('cv'),ctx=cv.getContext('2d');
let W=168,H=360,time=0;const MW_PX=30*16,MH_PX=62*16;
function resize(){
  const r=$('app').getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=Math.max(60,Math.min(r.width,Math.round(r.height*2.6))),ch=Math.max(60,r.height);
  cv.style.width=cw+'px';cv.style.left=Math.round((r.width-cw)/2)+'px';
  const s=Math.max(1,Math.round(Math.min(cw,ch)*dpr/170),Math.ceil(cw*dpr/(MW_PX-4)),Math.ceil(ch*dpr/(MH_PX-4)));
  W=Math.max(120,Math.ceil(cw*dpr/s));H=Math.max(90,Math.ceil(ch*dpr/s));
  cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
  // telas pequenas: encolhe menus e controles pra nada ficar cortado
  const k=r.width>r.height?clamp(r.height/370,.5,1):clamp(Math.min(r.width/350,r.height/600),.55,1);
  const st=document.documentElement.style;st.setProperty('--k',k.toFixed(3));st.setProperty('--kc',Math.max(.7,k).toFixed(3));
}
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}

/* ================= save ================= */
const SAVE_KEY='vila-letys-v1';
const ORDER=['horta','sorvete','sushi','parque','pesca','ritmo'];
let S={done:{},intro:false,ended:false};
function load(){try{const j=JSON.parse(localStorage.getItem(SAVE_KEY));if(j&&j.done)S=j;}catch(e){}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
const nDone=()=>ORDER.filter(k=>S.done[k]).length;

/* ================= audio ================= */
let AC=null,master=null,sfxBus=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{const C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=muted?0:1;
    master.connect(AC.destination);sfxBus=AC.createGain();sfxBus.gain.value=.5;sfxBus.connect(master);
    if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}
}
const mfreq=m=>440*Math.pow(2,(m-69)/12);
const clock=()=>AC?AC.currentTime:performance.now()/1000;
function voice(bus,f,t,d,type,vol,atk,f2){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(atk||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05);
}
function sfx(n){
  if(!AC)return;const t=AC.currentTime+.01,b=sfxBus;
  switch(n){
    case'tap':voice(b,620,t,.07,'triangle',.25);break;
    case'ok':voice(b,880,t,.1,'triangle',.3);voice(b,1320,t+.07,.14,'triangle',.3);break;
    case'bad':voice(b,180,t,.2,'square',.12,.01,110);break;
    case'jump':voice(b,380,t,.16,'triangle',.25,.01,720);break;
    case'talk':voice(b,520+Math.random()*180,t,.04,'square',.035);break;
    case'win':[72,76,79,84].forEach((m,i)=>voice(b,mfreq(m),t+i*.11,.32,'triangle',.3));break;
    case'unlock':[79,84,88,91].forEach((m,i)=>voice(b,mfreq(m),t+i*.07,.26,'sine',.25));break;
    case'splash':voice(b,300,t,.18,'sine',.25,.01,90);break;
    case'flip':voice(b,440,t,.05,'triangle',.2);break;

  play(song,loop,t0){
    this.stop();if(!AC)return;this.song=song;this.loop=loop!==false;this.bus=AC.createGain();this.bus.gain.value=song.vol||.5;
    this.bus.connect(master);this.t0=t0||AC.currentTime+.12;this.iter=0;this.idx=0;
    this.timer=setInterval(()=>this.tick(),50);this.tick();
  },
  tick(){
    const s=this.song,spb=60/s.bpm,now=AC.currentTime;
    for(let n=0;n<300;n++){
      if(this.idx>=s.ev.length){if(!this.loop){clearInterval(this.timer);this.timer=null;return;}this.idx=0;this.iter++;}
      const e=s.ev[this.idx],t=this.t0+(this.iter*s.len+e.t)*spb;

  },
  stop(){
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    if(this.bus){const b=this.bus;try{b.gain.setTargetAtTime(0,AC.currentTime,.06);}catch(e){}setTimeout(()=>{try{b.disconnect();}catch(e){}},500);this.bus=null;}

const MW=30,MH=62,TS=16;
const T=new Array(MW*MH).fill('G');

const at=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?'X':T[y*MW+x];
const set=(x,y,c)=>{if(x>=0&&y>=0&&x<MW&&y<MH)T[y*MW+x]=c;};

const seg=(x0,y0,x1,y1)=>{for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)set(x,y,'P');};
const props=[];
function addProp(img,x,y){props.push({img,x,y,ax:img.width>>1,ay:img.height-1});}
function footprint(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)blockT[j*MW+i]=1;}

  rect(17,41,13,2,'W');rect(17,41,2,21,'W');
  rect(19,15,9,10,'W');[[19,15],[27,15],[19,24],[27,24],[20,15],[26,24]].forEach(p=>set(p[0],p[1],'G'));
  rect(3,16,9,8,'C');
  for(let x=9;x<=15;x++){set(x,43,'F');set(x,47,'F');}for(let y=43;y<=47;y++){set(9,y,'F');set(15,y,'F');}
  rect(10,44,5,3,'D');
  for(let x=2;x<=12;x++){set(x,29,'F');set(x,39,'F');}for(let y=29;y<=39;y++){set(2,y,'F');set(12,y,'F');}
  seg(5,48,5,50);seg(5,50,16,50);seg(12,47,12,50);
  seg(19,50,27,50);seg(27,43,27,50);seg(23,43,27,43);seg(23,49,23,50);
  seg(23,34,23,40);seg(12,37,23,37);seg(14,28,14,37);seg(14,13,14,27);seg(12,20,18,20);
  set(17,50,'B');set(18,50,'B');set(23,41,'V');set(23,42,'V');
  for(let x=19;x<=22;x++)set(x,20,'K');
  for(let y=14;y<MH;y++){if(at(0,y)==='G')set(0,y,'T');if(at(29,y)==='G')set(29,y,'T');}
  for(let y=59;y<MH;y++)for(let x=0;x<MW;x++)if(at(x,y)==='G')set(x,y,'T');
  [[10,31],[3,38],[11,35]].forEach(p=>set(p[0],p[1],'T'));
  // prédios
  footprint(3,45,5,3);addProp(SPR_HOUSE,88,48*16);
  footprint(21,46,5,3);addProp(SPR_SORV,376,49*16);
  footprint(21,31,5,3);addProp(SPR_SUSHI,376,34*16);
  footprint(6,18,3,2);addProp(SPR_CORETO,120,20*16);
  footprint(4,31,2,1);addProp(SPR_DOGHOUSE,80,32*16);
  // árvores espalhadas
  const reserved=[[1,42,16,11],[19,43,10,10],[3,30,9,9],[19,28,9,9],[1,6,28,7],[13,14,3,28]];
  const inRes=(x,y)=>reserved.some(r=>x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3]);
  for(let y=14;y<59;y++)for(let x=1;x<29;x++){
    if(at(x,y)!=='G'||inRes(x,y)||blockT[y*MW+x]||hash(x*5+3,y*7+1)>.16)continue;
    let ok=true;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const c=at(x+i,y+j);if(c!=='G'&&c!=='T')ok=false;if(blockT[(y+j)*MW+x+i])ok=false;}
    if(ok)set(x,y,'T');
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(at(x,y)==='T'){
    const v=(y>27&&y<41&&x>15)?2:(hash(x,y)<.12?2:(hash(x+7,y)<.5?0:1));
    addProp(SPR_TREES[v],x*16+8,y*16+15);
  }
  [[1,7],[3,11],[27,7],[28,10],[24,12],[6,12],[10,7],[20,11]].forEach(p=>{blockT[p[1]*MW+p[0]]=1;addProp(SPR_PALM,p[0]*16+8,p[1]*16+14);});
  props.sort((a,b)=>a.y-b.y);
}

const isPathy=c=>'PBVKCS'.includes(c),isWet=c=>'WBVKX'.includes(c);
function tGrass(g,px,py,tx,ty){

  for(let i=0;i<4;i++){const x=px+Math.floor(hash(tx*7+i,ty*13+i*3)*14),y=py+1+Math.floor(hash(tx+i*5,ty*3+i)*14),c=i%2?'#6fb85c':'#9ddb80';R(g,c,x,y,2,1);if(i<2)R(g,c,x+1,y-1,1,1);}
  const f=hash(tx*3+1,ty*5+2),lim=S.ended?.34:.1;
  if(f<lim){const x=px+3+Math.floor(hash(tx,ty+9)*9),y=py+3+Math.floor(hash(tx+9,ty)*9);
    const col=S.ended?(f<.22?'#6fb4ff':f<.28?'#ffffff':'#ff9ec4'):(f<.04?'#ffffff':f<.07?'#6fb4ff':'#ffd95a');
    R(g,col,x-1,y,3,1);R(g,col,x,y-1,1,3);R(g,col==='#ffffff'||col==='#6fb4ff'?'#ffd95a':'#ffffff',x,y,1,1);}
}
function tPath(g,px,py,tx,ty){
  R(g,'#edd7a3',px,py,16,16);
  for(let i=0;i<3;i++)R(g,i%2?'#dcc188':'#f7e8bd',px+Math.floor(hash(tx*11+i,ty*3)*14),py+Math.floor(hash(tx,ty*17+i)*14),2,1);
  const n=!isPathy(at(tx,ty-1)),s=!isPathy(at(tx,ty+1)),w=!isPathy(at(tx-1,ty)),e=!isPathy(at(tx+1,ty)),ec='#c9aa6e',gr='#84c96a';
  if(n)R(g,ec,px,py,16,1);if(s)R(g,ec,px,py+15,16,1);if(w)R(g,ec,px,py,1,16);if(e)R(g,ec,px+15,py,1,16);
  if(n&&w){R(g,gr,px,py,2,1);R(g,gr,px,py+1,1,1);R(g,ec,px+1,py+1,1,1);}
  if(n&&e){R(g,gr,px+14,py,2,1);R(g,gr,px+15,py+1,1,1);R(g,ec,px+14,py+1,1,1);}
  if(s&&w){R(g,gr,px,py+15,2,1);R(g,gr,px,py+14,1,1);R(g,ec,px+1,py+14,1,1);}
  if(s&&e){R(g,gr,px+14,py+15,2,1);R(g,gr,px+15,py+14,1,1);R(g,ec,px+14,py+14,1,1);}
}
function tWater(g,px,py,tx,ty){
  R(g,'#63b8ec',px,py,16,16);
  for(let i=0;i<2;i++)R(g,'#8fd2f7',px+2+Math.floor(hash(tx*5+i,ty*9)*10),py+5+Math.floor(hash(tx*3,ty*7+i)*9),4,1);
  if(!isWet(at(tx,ty-1))){R(g,'#b58d5c',px,py,16,3);R(g,'#8f6c44',px,py+3,16,1);R(g,'#4f9fd6',px,py+4,16,2);}
  if(!isWet(at(tx,ty+1))){R(g,'#bfe8fb',px,py+14,16,1);R(g,'#5aa457',px,py+15,16,1);}
  if(!isWet(at(tx-1,ty))){R(g,'#bfe8fb',px+1,py,1,16);R(g,'#5aa457',px,py,1,16);}
  if(!isWet(at(tx+1,ty))){R(g,'#bfe8fb',px+14,py,1,16);R(g,'#5aa457',px+15,py,1,16);}
}
function tSand(g,px,py,tx,ty){
  R(g,'#f5e2ad',px,py,16,16);
  for(let i=0;i<3;i++)R(g,i%2?'#e7d08f':'#fff1c9',px+Math.floor(hash(tx*13+i,ty*5)*14),py+Math.floor(hash(tx,ty*11+i)*14),2,1);

  else if(f<.11){const x=px+6,y=py+8;R(g,'#ff9a6b',x-2,y,5,1);R(g,'#ff9a6b',x,y-2,1,5);R(g,'#ff9a6b',x-1,y-1,3,3);}
}
function tHedge(g,px,py,tx,ty){
  tGrass(g,px,py,tx,ty);R(g,'#2f7d46',px,py+3,16,13);R(g,'#2f7d46',px+1,py+1,6,2);R(g,'#2f7d46',px+9,py+1,6,2);R(g,'#2f7d46',px+2,py,4,1);R(g,'#2f7d46',px+10,py,4,1);

function tFence(g,px,py,tx,ty){

function tCobble(g,px,py,tx,ty){

function tBridge(g,px,py,tx,ty,c){

function drawTile(g,tx,ty){
  const c=at(tx,ty),px=tx*16,py=ty*16;
  switch(c){
    case'P':tPath(g,px,py,tx,ty);break;case'W':tWater(g,px,py,tx,ty);break;case'S':tSand(g,px,py,tx,ty);break;
    case'H':tHedge(g,px,py,tx,ty);break;case'F':tFence(g,px,py,tx,ty);break;case'D':tSoil(g,px,py,tx,ty);break;
    case'C':tCobble(g,px,py,tx,ty);break;case'B':case'V':case'K':tBridge(g,px,py,tx,ty,c);break;
    case'Y':tSky(g,px,py);break;case'O':tOcean(g,px,py,tx,ty);break;default:tGrass(g,px,py,tx,ty);

/* ---------- world update/draw ---------- */
function updateWorld(dt){
  let vx=joy.x,vy=joy.y;
  if(keys.arrowleft||keys.a)vx-=1;if(keys.arrowright||keys.d)vx+=1;if(keys.arrowup||keys.w)vy-=1;if(keys.arrowdown||keys.s)vy+=1;
  const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m;}
  P.moving=m>.15&&!dlg.open;
  if(P.moving){
    const sp=64,ox=P.x,oy=P.y;
    if(!blocked(P.x+vx*sp*dt,P.y))P.x+=vx*sp*dt;
    if(!blocked(P.x,P.y+vy*sp*dt))P.y+=vy*sp*dt;
    P.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');P.anim+=dt*9;
    const l=trail[trail.length-1];
    if(!l||Math.hypot(P.x-l.x,P.y-l.y)>=3){trail.push({x:P.x,y:P.y});if(trail.length>40)trail.shift();}
    if(P.x===ox&&P.y===oy)P.anim=0;
  }
  dogs.forEach(d=>{
    d.moving=false;
    if(S.done.parque){
      const tg=trail[trail.length-1-d.back];
      if(tg){const dx=tg.x-d.x,dy=tg.y-d.y,dist=Math.hypot(dx,dy);
        if(dist>1.5){const st=Math.min(dist,78*dt);d.x+=dx/dist*st;d.y+=dy/dist*st;d.moving=true;if(Math.abs(dx)>.5)d.dir=dx>0?'right':'left';}}
      else if(Math.abs(P.x-d.x)>2)d.dir=P.x>d.x?'right':'left';
    }
    d.anim+=dt*(d.moving?10:3);
  });
  if(!dlg.open){curAct=findAct();if(curAct)$('act').textContent=curAct.label;show('act',!!curAct);}
}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.heart)p.vy+=90*dt;if(p.life<=0)parts.splice(i,1);}
  flies.forEach(f=>{
    if(!f.init||Math.abs(f.x-(camX+W/2))>W||Math.abs(f.y-(camY+H/2))>H){f.x=camX+Math.random()*W;f.y=camY+Math.random()*H;f.init=true;}
    f.a+=dt*(1+Math.sin(time+f.x)*.5);f.x+=Math.cos(f.a)*14*dt;f.y+=Math.sin(f.a*1.3)*10*dt;
  });
}
function shadow(x,y,w){ctx.fillStyle='rgba(30,40,30,.22)';ctx.fillRect(Math.round(x-w/2),Math.round(y-2),w,3);ctx.fillRect(Math.round(x-w/2)+1,Math.round(y-3),w-2,5);}
function drawWorld(){
  camX=Math.round(clamp(P.x-W/2,0,MW*16-W));camY=Math.round(clamp(P.y-H*.56,0,MH*16-H));
  ctx.drawImage(groundCv,-camX,-camY);
  // água viva
  const tx0=Math.floor(camX/16),ty0=Math.floor(camY/16),tick=Math.floor(time*1.6);
  for(let ty=ty0;ty<=ty0+Math.ceil(H/16);ty++)for(let tx=tx0;tx<=tx0+Math.ceil(W/16);tx++){
    const c=at(tx,ty);
    if(c==='W'||c==='O'){const h=hash(tx*3+tick,ty*5-tick);if(h<.3){ctx.fillStyle=c==='W'?'#d4f1fd':'rgba(255,255,255,.6)';ctx.fillRect(tx*16+2+Math.floor(h*36)-camX,ty*16+6+Math.floor(hash(tx,ty+tick)*8)-camY,3,1);}}
  }
  if(camY<110){ // espuma da praia
    for(let x=0;x<W;x+=2){const wx=x+camX,y=96+Math.round(Math.sin(time*1.4+wx*.11)*2+Math.sin(time*.7+wx*.05)*1.5)-camY;
      ctx.fillStyle='#ffffff';ctx.fillRect(x,y,2,2);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(x,y+2,2,1);ctx.fillStyle='rgba(112,190,236,.9)';ctx.fillRect(x,y-3,2,3);}
  }
  // entidades ordenadas por y
  const list=[];
  for(const p of props){if(p.y<camY-4||p.y>camY+H+96||p.x<camX-44||p.x>camX+W+44)continue;list.push(p);}
  GATES.forEach(g=>{if(g.open()||g.kind==='bridge')return;const t=g.tiles[0];list.push({y:t[1]*16+15,gate:g,x:t[0]*16+8});});
  list.push({y:P.y,pl:true},{y:teasy.y,te:true});
  dogs.forEach(d=>list.push({y:d.y,dog:d}));
  list.sort((a,b)=>a.y-b.y);
  for(const o of list){
    if(o.img)ctx.drawImage(o.img,o.x-o.ax-camX,o.y-o.ay-camY);
    else if(o.gate){const im=o.gate.kind==='heart'?SPR_HGATE:SPR_GATE;ctx.drawImage(im,o.x-9-camX,o.y-21-camY);}
    else if(o.pl){shadow(P.x-camX,P.y-camY,10);drawChar(ctx,SPR_LETYS,P.x-camX,P.y-camY+1,P.dir,P.anim,P.moving);}
    else if(o.te){shadow(teasy.x-camX,teasy.y-camY,10);const bob=Math.sin(time*2)>.6?1:0;drawChar(ctx,SPR_TEASY,teasy.x-camX,teasy.y-camY+1-bob,teasy.y<200?'right':'down',0,false);}
    else if(o.dog){const d=o.dog,im=d.set[d.dir][Math.floor(d.anim)%2];shadow(d.x-camX,d.y-camY,d.w+3);
      const hop=(!d.moving&&!S.done.parque&&Math.sin(time*3+d.w)>.92)?2:0;ctx.drawImage(im,Math.round(d.x-im.width/2)-camX,Math.round(d.y)-15-camY-hop);}
  }
  // marcadores
  if(scene==='world'||scene==='title'){
    const bob=Math.round(Math.sin(time*4)*1.5);
    for(const it of interactables()){if(!it.mark)continue;const im=it.mark==='!'?SPR_BANG:SPR_DONE;ctx.drawImage(im,Math.round(it.mx-im.width/2)-camX,Math.round(it.my)-camY+(it.mark==='!'?bob:0));}
  }
  // borboletas e partículas
  flies.forEach(f=>{const fl=Math.sin(time*18+f.a)>0;ctx.fillStyle=f.c;const x=Math.round(f.x)-camX,y=Math.round(f.y)-camY;ctx.fillRect(x-(fl?2:1),y,fl?2:1,2);ctx.fillRect(x+1,y,fl?2:1,2);ctx.fillStyle='#3a3046';ctx.fillRect(x,y,1,2);});
  for(const p of parts){const x=Math.round(p.x)-camX,y=Math.round(p.y)-camY;if(p.heart){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.drawImage(p.img,x-4,y-3);ctx.globalAlpha=1;}else{ctx.fillStyle=p.c;ctx.fillRect(x,y,2,2);}}
  // pôr do sol na praia
  const k=clamp((15*16-P.y)/(5*16),0,1);
  if(k>0){ctx.fillStyle='rgba(255,128,80,'+(k*(scene==='end'?.26:.17)).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- 2. Sorveteria ---------- */
sorvete(){
  let coneX=W/2,target=W/2,spawn=.7,shake=0,sink=0;const stack=[],items=[],base0=H-58,maxTower=Math.max(20,base0-96);let baseY=base0;

  });
  return{
    update(dt){
      coneX+=(target-coneX)*Math.min(1,dt*16);shake=Math.max(0,shake-dt);
      sink+=(Math.max(0,stack.length*10-maxTower)-sink)*Math.min(1,dt*8);baseY=base0+Math.round(sink);
      if(mgEndT!==null){mgEndT-=dt;if(mgEndT<=0)finishMG(true);return;}

      const topY=baseY-stack.length*10;

        if(it.y+7>=topY&&it.y+7<=topY+12&&Math.abs(it.x-coneX)<14){
          if(it.chili){if(stack.length){stack.pop();}sfx('bad');shake=.25;mgMsg('Pimenta! 🌶️');}

        if(it.y>H+20)items.splice(i,1);}
      setScore('🍦 '+stack.length+'/10');
      if(stack.length>=10){mgEndT=.8;mgMsg('Torre perfeita! 💙');}

  };

  const msgs={idle:'Toque pra lançar a linha',wait:'Espera...',bite:'AGORA!'};
  const go=s=>{st=s;tm=0;};
  return{
    update(dt){
      tm+=dt;
      if(st==='wait'&&tm>this.waitFor){go('bite');sfx('splash');}
      else if(st==='bite'&&tm>1){go('idle');mgMsg('Escapou...');}
      else if(st==='show'){if(tm>1.9){pop=null;if(n>=5)return finishMG(true);go('idle');}}
      setScore('🎣 '+n+'/5');
    },
    draw(g){
      g.drawImage(bg,0,0);
      const tick=Math.floor(time*1.6);for(let ty=0;ty<dockY/16;ty++)for(let tx=0;tx<=W/16;tx++){const h=hash(tx*3+tick,ty*5-tick);if(h<.2)R(g,'#d4f1fd',tx*16+Math.floor(h*50),ty*16+7,3,1);}
      const px=Math.round(W/2),py=dockY+44;
      g.fillStyle='rgba(30,40,30,.2)';g.fillRect(px-11,py-3,22,5);
      const im=SPR_LETYS.up[0];g.drawImage(im,px-18,py-46,36,48);
      const tipX=px+26,tipY=dockY-18;line(g,'#6f452b',px+12,py-18,tipX,tipY,2);
      if(st!=='idle'&&st!=='show'){
        const dip=st==='bite'?4+Math.round(Math.sin(time*30)*1.5):Math.round(Math.sin(time*3)*1.5),bx=Math.round(bx0),by=by0+dip;
        line(g,'rgba(255,255,255,.8)',tipX,tipY,bx,by,1);
        R(g,'#d4f1fd',bx-5,by0+4,11,1);disc(g,'#ffffff',bx,by,3);R(g,'#e23d57',bx-3,by-3,7,3);
        if(st==='bite')g.drawImage(SPR_BANG,bx-11,by-36,22,26);
      }
      if(pop){const k=Math.min(1,tm/.2),w=pop.img.width*3,h=pop.img.height*3,cx=W>>1,cy=Math.round(H*(H<230?.46:.34));
        disc(g,'rgba(255,255,255,.85)',cx,cy,Math.round(30*k));g.drawImage(pop.img,cx-Math.round(w*k/2),cy-Math.round(h*k/2),Math.round(w*k),Math.round(h*k));}
      if(st!=='show'&&time%1<.6||st==='bite'){/* dica via DOM */}
    },
    down(){
      if(st==='idle'){go('wait');this.waitFor=1.1+Math.random()*2.1;sfx('jump');mgMsg(msgs.wait);}
      else if(st==='wait'){go('idle');sfx('bad');mgMsg('Cedo demais! O peixe fugiu');}
      else if(st==='bite'){pop=CATCH[n];n++;go('show');sfx('ok');mgMsg(pop.n+'! '+pop.m);}
    },
    waitFor:2
  };
},
/* ---------- 6. Ritmo ---------- */
ritmo(){
  const useAC=!!(AC&&AC.state==='running'),clock=()=>useAC?AC.currentTime:performance.now()/1000;
  const song=SONG_SER,spb=60/song.bpm,t0=clock()+2.4;Music.play(song,false,useAC?t0:undefined);
  const notes=song.mel.map(n=>({t:t0+n.t*spb,lane:n.lane,hit:0})),total=notes.length;
  const hitY=H-(H<230?40:74),travel=1.9,sp=(hitY+14)/travel,lw=W/3,endT=notes[total-1].t+2.2;
  let hits=0,combo=0;const flash=[0,0,0],pops=[];
  const cols=['#5aa6f2','#ff8fb3','#ffd95a'],himg=[SPR_HEART_B,SPR_HEART_P,SPR_HEART_G];
  const bg=mk(W,H,g=>{
    for(let y=0;y<H;y++){g.fillStyle=mixc([26,28,66],[70,50,120],y/H);g.fillRect(0,y,W,1);}
    for(let i=0;i<50;i++)R(g,i%5?'rgba(255,255,255,.55)':'#ffe9a8',Math.floor(hash(i,7)*W),Math.floor(hash(i*3,11)*hitY*.9),1,1);
    for(let l=0;l<3;l++){R(g,'rgba(255,255,255,.05)',Math.round(l*lw)+2,0,Math.round(lw)-4,H);}
    for(let l=1;l<3;l++)R(g,'rgba(255,255,255,.18)',Math.round(l*lw),0,1,H);
    R(g,'rgba(255,255,255,.35)',0,hitY+6,W,1);
    for(let x=4,i=0;x<W;x+=9,i++)R(g,['#ffd95a','#ff9ec4','#7ec8ff'][i%3],x,3+Math.round(Math.sin(i*.7)*2),2,2);
  });
  mgMsg('Prepara...');
  return{_notes:notes,_clock:clock,
    update(dt){
      const now=clock();
      for(const n of notes)if(!n.hit&&now>n.t+.22){n.hit=-1;combo=0;}
      for(let l=0;l<3;l++)flash[l]=Math.max(0,flash[l]-dt*4);
      for(let i=pops.length-1;i>=0;i--){pops[i].t-=dt;if(pops[i].t<=0)pops.splice(i,1);}
      setScore('🎵 '+hits+'/'+total+(combo>=5?' · x'+combo:''));
      if(now>endT)finishMG(hits/total>=.5);
    },
    draw(g){
      g.drawImage(bg,0,0);const now=clock();
      for(let l=0;l<3;l++){const cx=Math.round(l*lw+lw/2);
        if(flash[l]>0){g.globalAlpha=flash[l]*.35;R(g,cols[l],Math.round(l*lw)+1,0,Math.round(lw)-1,H);g.globalAlpha=1;}
        disc(g,'rgba(255,255,255,.18)',cx,hitY+6,13);disc(g,cols[l],cx,hitY+6,10+(flash[l]>0?2:0));disc(g,'rgba(26,28,66,.75)',cx,hitY+6,7);}
      for(const n of notes){if(n.hit)continue;const y=hitY-(n.t-now)*sp;if(y<-20)continue;const cx=Math.round(n.lane*lw+lw/2);g.drawImage(himg[n.lane],cx-9,Math.round(y)-2,18,16);}
      pops.forEach(p=>{const k=1-p.t/.35,cx=Math.round(p.l*lw+lw/2);g.globalAlpha=1-k;const s=Math.round(18+k*22);g.drawImage(himg[p.l],cx-(s>>1),hitY+6-(s>>1),s,Math.round(s*.89));g.globalAlpha=1;});
    },
    down(x){
      const lane=clamp(Math.floor(x/lw),0,2),now=clock();flash[lane]=1;let bn=null,bd=9;
      for(const n of notes){if(n.hit||n.lane!==lane)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;bn=n;}}
      if(bn&&bd<.22){bn.hit=1;hits++;combo++;pops.push({l:lane,t:.35});if(combo&&combo%10===0)mgMsg('Combo x'+combo+'! 💙');else if(bd<.07&&combo%4===0)mgMsg('Perfeito!');}
    }
  };
}
};

/* ================= ending ================= */
const LETTER='Oi, meu amor.\n\nHoje é só mais um mês pra nós, mas eu quis deixar esse dia ainda mais especial. A gente tem passado por tanta coisa, meu amor, mas o que eu sinto por você nunca muda.\n\nQueria muito poder te dar tanta coisa. Ver você feliz, sorrindo, é a minha força de todo dia. Tudo que eu mais quero nesse mundo é ver você tendo a vida que sempre quis. Aguenta só mais um pouquinho, meu amor: as coisas vão melhorar.\n\nBejuuuu, tiamiooo muitiioooo. 💙';
const endSt={typed:0,acc:0,done:false,hearts:[]};
function monthsTogether(){const n=new Date();let m=(n.getFullYear()-2025)*12+(n.getMonth()-1);if(n.getDate()<15)m--;return Math.max(0,m);}
function startEnding(){
  scene='end';show('hud',false);show('mute',false);show('fs',false);show('act',false);show('toast',false);
  endSt.typed=0;endSt.acc=0;endSt.done=false;$('letter').textContent='';show('since',false);show('endok',false);show('ending',true);
  P.dir='left';Music.play(SONG_SER,true);
}
function endTick(dt){
  if(Math.random()<dt*5)endSt.hearts.push({x:Math.random()*W,y:H+8,v:14+Math.random()*18,ph:Math.random()*6,img:[SPR_HEART_B,SPR_HEART_P,SPR_HEART_B][Math.random()*3|0],s:Math.random()<.3?2:1});
  for(let i=endSt.hearts.length-1;i>=0;i--){const h=endSt.hearts[i];h.y-=h.v*dt;if(h.y<-20)endSt.hearts.splice(i,1);}
  if(endSt.done)return;
  endSt.acc+=dt*30;const n=Math.floor(endSt.acc);
  if(n>0){endSt.acc-=n;endSt.typed=Math.min(LETTER.length,endSt.typed+n);const el=$('letter');el.textContent=LETTER.slice(0,endSt.typed);el.scrollTop=el.scrollHeight;if(endSt.typed>=LETTER.length)endFinish();}
}
function endFinish(){
  endSt.done=true;const el=$('letter');el.textContent=LETTER;const b=document.createElement('b');b.textContent='— seu Teasy';el.appendChild(b);el.scrollTop=el.scrollHeight;
  const m=monthsTogether();$('since').innerHTML='Juntos desde <em>15.02.2025</em><br><span class="sep"> · </span>'+(m>0?'<em>'+m+(m===1?' mês':' meses')+'</em> e contando 💙':'e contando 💙');
  show('since',true);show('endok',true);sfx('win');
  if(!S.ended){S.ended=true;save();renderGround();}
}
function drawEndHearts(){for(const h of endSt.hearts){const x=Math.round(h.x+Math.sin(time*1.5+h.ph)*6),y=Math.round(h.y);ctx.globalAlpha=.85;ctx.drawImage(h.img,x,y,h.img.width*h.s,h.img.height*h.s);}ctx.globalAlpha=1;}
$('letter').addEventListener('click',()=>{if(!endSt.done)endFinish();});
$('endok').onclick=()=>{sfx('tap');show('ending',false);scene='world';show('hud',true);show('mute',true);show('fs',canFS);updateHud();Music.play(SONG_VILA);toast('🌸 A vila inteira floresceu pra você',3500);};

/* ================= boot ================= */
function startGame(){
  initAudio();show('title',false);show('hud',true);show('mute',true);show('fs',canFS);scene='world';updateHud();Music.play(SONG_VILA);
  if(!S.intro){
    say([{w:'Teasy',t:'Oi, mozi! Bem-vinda à Vila Letys 💙'},{w:'Teasy',t:'Eu construí essa vila inteirinha pra você. Tem a sua casa, sorveteria, sushi e até o Euros e a Aurora.'},
      {w:'Teasy',t:'Escondi 6 corações azuis por aí. Cada um guarda uma coisa que eu quero te dizer.'},
      {w:'Teasy',t:'Usa as setinhas no canto pra andar. Junta todos os corações e me encontra na praia. Começa pela horta aqui do lado!'}],
      ()=>{S.intro=true;save();});
  }
}
$('play').onclick=startGame;
$('reset').onclick=()=>{S={done:{},intro:false,ended:false};save();P.x=88;P.y=49*16+10;dogs[0].x=7*16;dogs[0].y=34*16;dogs[1].x=9*16;dogs[1].y=35*16+4;trail.length=0;placeTeasy();refreshGates();show('reset',false);$('play').textContent='Jogar';};
const fsRoot=document.documentElement,fsReq=fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
const canFS=!!((document.fullscreenEnabled||document.webkitFullscreenEnabled)&&fsReq&&fsExit);
function toggleFS(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){fsExit.call(document);return;}
    const p=fsReq.call(fsRoot);if(p&&p.catch)p.catch(()=>toast('Tela cheia não funciona nesse navegador'));
  }catch(e){toast('Tela cheia não funciona nesse navegador');}
}
try{if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&window.top===window.self)show('iostip',true);}catch(e){}
$('fs').onclick=toggleFS;$('fs2').onclick=toggleFS;if(canFS)show('fs2',true);
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>setTimeout(()=>dispatchEvent(new Event('resize')),60)));
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:1;};
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
addEventListener('resize',()=>{const ow=W,oh=H;resize();const big=(ow>oh)!==(W>H)||Math.abs(W-ow)/ow>.1||Math.abs(H-oh)/oh>.1;
  if(big&&scene==='mg'&&mg&&!mgOver&&mgId!=='sushi'){const id=mgId;Music.stop();mgEndT=null;mg=MG[id]();if(id!=='ritmo')Music.play(SONG_VILA);mgMsg('Tela girada: recomeçando');}});
document.addEventListener('contextmenu',e=>e.preventDefault());

load();resize();buildMap();placeTeasy();refreshGates();
if(nDone()>0||S.intro){$('play').textContent='Continuar';show('reset',true);}
if(S.done.parque)dogsToPlayer();
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
  if(scene==='mg'&&mg){if(!pad.classList.contains('hide')){show('dpad',false);joyEnd();}if(!mgOver)mg.update(dt);if(mg)mg.draw(ctx);}
  else{
    if(scene==='world')updateWorld(dt);
    const padOn=scene==='world'&&!dlg.open;if(pad.classList.contains('hide')===padOn){show('dpad',padOn);if(!padOn)joyEnd();}
    if(scene==='end')endTick(dt);
    dlgTick(dt);updateFx(dt);drawWorld();
    if(scene==='end')drawEndHearts();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
